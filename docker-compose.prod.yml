# moyu (kun-galgame-patch) — PRODUCTION compose (Dokploy + GHCR images).
#
# Downstream app: owns NO backing services. Joins the shared `dokploy-network`
# and reaches infra by service name (postgres:5432, oauth:9277, catalog:9281,
# image:9278). Bring infra up first.
#
# vs docker-compose.yml (dev): `image:` not `build:`, `expose:` not `ports:`,
# and **NO `env_file`** — all config is inline `environment:` so Dokploy needs no
# `docker/*.env` on disk. Non-secret/domains are literal; secrets come from the
# moyu app's **Dokploy Environment** via ${VAR}.
#
# Set in moyu's Dokploy Environment:
#   POSTGRES_PASSWORD  OAUTH_CLIENT_SECRET
#   KUN_VISUAL_NOVEL_S3_STORAGE_ACCESS_KEY_ID / _SECRET_ACCESS_KEY   (B2 补丁文件)
#   (optional) KUN_VISUAL_NOVEL_EMAIL_PASSWORD  KUN_IMAGE_OAUTH_CLIENT_ID/SECRET
# MUST match infra: POSTGRES_PASSWORD = infra POSTGRES_PASSWORD;
# OAUTH_CLIENT_SECRET = 注册补丁 client 的明文.  (moyu 没有 JWT_SECRET — 不透明会话)
#
#   docker compose -f docker-compose.prod.yml up -d
# The `migrate` service runs automatically before moyu-api on every `up` (api
# depends_on it completing) — pending DB migrations are applied on each deploy,
# no manual migrate step. `tools` stays a manual `--profile jobs` one-off.
name: moyu

x-svc-health: &svc-health
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

# ── api / migrate / tools runtime env (literal = non-secret; ${VAR} = panel) ──
x-moyu-api-env: &moyu-api-env
  KUN_SERVER_PORT: "5214"
  KUN_SERVER_MODE: prod
  # ⚠ POSTGRES_PASSWORD 直接拼进 DSN → 必须 URL-safe(字母数字;勿含 @ : / # % ? &,否则 URL 解析坏)
  KUN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy}@postgres:5432/kungalgame_patch?sslmode=disable
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  OAUTH_SERVER_URL: http://oauth:9277/api/v1
  OAUTH_CLIENT_ID: df3ff6008d740bfacbe46aa8cf483cf2
  OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?set OAUTH_CLIENT_SECRET in Dokploy (补丁 client 注册时的明文)}
  OAUTH_REDIRECT_URI: https://www.moyu.moe/auth/callback
  # NextMoe catalog API (galgame reads via the internal tier). BASE is the HOST
  # base (no /api|/internal); the client derives {base}/internal (the rich read
  # face + the S2S message feed, X-API-Key) and {base}/api (writes / submissions
  # / image upload). The read face hard-depends on the key — an empty KEY fails
  # fast at startup (the legacy /api rollback valve was retired in wave 05). KEY
  # is a secret → set in the Dokploy Environment (kungal-neo
  # /root/phase2-internal-keys.env line moyu-patch-internal-s2s).
  KUN_NEXTMOE_API_BASE: http://catalog:9281
  KUN_NEXTMOE_API_KEY: ${KUN_NEXTMOE_API_KEY:-}
  # DLsite 正版购买入口。两个都留空 = 游戏页不渲染购买按钮 (当前默认)。
  # 打开需要两个决定:
  #   1) 联盟模板。kungal 用的是
  #      https://dlaf.jp/soft/dlaf/=/t/s/link/work/aid/kungal/locale/zh_CN/id/{workno}.html/?locale=zh_CN
  #      其中 aid/kungal 是联盟账号 ID。moyu 是否可以直接复用这个 aid, 取决于
  #      DLsite 联盟条款是否按站点/域名登记 —— 先确认再填。
  #   2) KUN_STORE_API_KEY: 第二把 developer key, scope 只需 store:read
  #      (开发者门户自助申请)。有它才会铸造带点击归因的短链; 没有也能卖, 只是
  #      infra 看不到是 moyu 带来的单。KUN_STORE_API_BASE 默认取
  #      KUN_NEXTMOE_API_BASE (同一个 catalog 进程)。
  KUN_DLSITE_LINK_TEMPLATE: ${KUN_DLSITE_LINK_TEMPLATE:-}
  KUN_DLSITE_COUPON_URL: ${KUN_DLSITE_COUPON_URL:-}
  KUN_STORE_API_KEY: ${KUN_STORE_API_KEY:-}
  # image_service (prod 必填) — CDN 域 == infra KUN_IMAGE_PUBLIC_BASE_URL
  KUN_IMAGE_SERVICE_BASE_URL: http://image:9278
  KUN_IMAGE_CDN_BASE: https://image.kungal.iloveren.link
  # artifact service (prod 必填,getEnvProd) — internal, on dokploy-network.
  # Read by config.Load() in EVERY moyu binary (api/migrate/tools), so it must
  # be here in the shared anchor, not just the Dokploy panel.
  KUN_ARTIFACT_SERVICE_BASE_URL: http://artifact:9279
  # forge bot lane (same key/user as letmoe). Either one empty = routes not
  # registered. The user id is also provisioned into the local "user" table at
  # boot -- both patch.user_id and patch_resource.user_id have a FK to it.
  KUN_BOT_SUBMIT_KEY: ${KUN_BOT_SUBMIT_KEY:-}
  KUN_BOT_SUBMIT_USER_ID: ${KUN_BOT_SUBMIT_USER_ID:-}
  KUN_IMAGE_OAUTH_CLIENT_ID: ${KUN_IMAGE_OAUTH_CLIENT_ID:-}
  KUN_IMAGE_OAUTH_CLIENT_SECRET: ${KUN_IMAGE_OAUTH_CLIENT_SECRET:-}
  # B2 — patch resource files (NOT image_service). 补丁下载/上传是补丁站核心功能,
  # 空 key → 上传/下载链路必坏 → 所以 key fail-fast(不让一个下不了补丁的站上线)。
  KUN_VISUAL_NOVEL_S3_STORAGE_ENDPOINT: https://s3.us-east-005.backblazeb2.com
  KUN_VISUAL_NOVEL_S3_STORAGE_URL: https://oss.moyu.moe
  KUN_VISUAL_NOVEL_S3_STORAGE_REGION: us-east-005
  KUN_VISUAL_NOVEL_S3_STORAGE_BUCKET_NAME: kun-galgame-patch
  KUN_VISUAL_NOVEL_S3_STORAGE_ACCESS_KEY_ID: ${KUN_VISUAL_NOVEL_S3_STORAGE_ACCESS_KEY_ID:?B2 access key — 补丁站核心,必填}
  KUN_VISUAL_NOVEL_S3_STORAGE_SECRET_ACCESS_KEY: ${KUN_VISUAL_NOVEL_S3_STORAGE_SECRET_ACCESS_KEY:?B2 secret — 必填}
  # mail (blank → disabled)
  KUN_VISUAL_NOVEL_EMAIL_HOST: tuesday.mxrouting.net
  KUN_VISUAL_NOVEL_EMAIL_PORT: "587"
  KUN_VISUAL_NOVEL_EMAIL_ACCOUNT: auth@moyu.moe
  KUN_VISUAL_NOVEL_EMAIL_PASSWORD: ${KUN_VISUAL_NOVEL_EMAIL_PASSWORD:-}
  CORS_ALLOW_ORIGINS: https://www.moyu.moe,https://moyu.moe
  # Absolute web_url on every row the /v2/moyu face answers: a third party has
  # no way to know that a patch id becomes www.moyu.moe/patch/<id>. Same value
  # as the code default — pinned here so it moves with the domain, not with a
  # release.
  KUN_SITE_BASE_URL: https://www.moyu.moe

services:
  # 服务名直接叫 moyu-api(不是 `api` + alias):Dokploy 不应用 compose 的 networks.aliases,
  # 只把「服务名」注册到 dokploy-network。两仓都叫 `api` 会 DNS 冲突,所以用唯一服务名,
  # SSR(moyu-web → http://moyu-api:5214)才能解析到。
  moyu-api:
    image: ghcr.io/kunmoe/moyu-api:latest
    # 每次部署强制重新拉 :latest;否则 Dokploy 的 `docker compose up` 会用本地旧缓存,
    # 即使 webhook 在构建完成后才触发也照样跑旧镜像。
    pull_policy: always
    environment: { <<: *moyu-api-env }
    expose: ["5214"]
    # The public developer-platform face (NextMoe doc 08 §16.5). These labels are
    # hand-written because they carry a middleware Dokploy's Domains panel cannot
    # express; the www.moyu.moe `/api/v1` routers beside them are still Dokploy's
    # own and are not repeated here.
    #
    # The gateway does the authenticating: forwardAuth asks oauth whether the
    # caller's nmk_ key is valid and within budget, and only then forwards. It
    # asks for no scope — a free read-only face admits any valid key (infra PR
    # #168); verified 2026-09-08 against production, where a key carrying only
    # catalog:read is answered 204 for face=moyu. Nothing strips the prefix, so
    # the API serves /v2/moyu/* verbatim.
    #
    # authResponseHeaders is what makes the three X-NextMoe-* headers
    # trustworthy: Traefik overwrites whatever the client sent with what oauth
    # answered.
    #
    # The explicit priority is not decoration. infra runs a catch-all
    # `Host(api.nextmoe.dev) && PathPrefix(/v2)` router (infra-v2-pub) that sets
    # no priority of its own, so Traefik derives one from the rule's length, 44 —
    # and that router is what answers /v2/moyu/* today, with its own 404 problem
    # document. Our rule is 49 characters, so without this line the face would
    # hold the path by 5 characters and one edit to infra's rule would silently
    # take it back.
    #
    # Dokploy does not redeploy on a compose-only change. Click Deploy.
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dokploy-network
      traefik.http.routers.moyu-face-pub.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/v2/moyu`)
      traefik.http.routers.moyu-face-pub.priority: '100'
      traefik.http.routers.moyu-face-pub.entrypoints: websecure
      traefik.http.routers.moyu-face-pub.tls.certresolver: letsencrypt
      traefik.http.routers.moyu-face-pub.middlewares: moyu-face-forwardauth
      traefik.http.routers.moyu-face-pub.service: moyu-face-pub
      traefik.http.routers.moyu-face-pub-http.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/v2/moyu`)
      traefik.http.routers.moyu-face-pub-http.priority: '100'
      traefik.http.routers.moyu-face-pub-http.entrypoints: web
      traefik.http.routers.moyu-face-pub-http.middlewares: redirect-to-https@file
      traefik.http.routers.moyu-face-pub-http.service: moyu-face-pub
      traefik.http.middlewares.moyu-face-forwardauth.forwardauth.address: http://oauth:9277/internal/devapi/forward-auth?face=moyu
      traefik.http.middlewares.moyu-face-forwardauth.forwardauth.authResponseHeaders: X-NextMoe-Client-Id,X-NextMoe-Key-Id,X-NextMoe-Tier
      traefik.http.services.moyu-face-pub.loadbalancer.server.port: '5214'
    # postgres/redis live in the infra app (no depends_on for them; restart
    # reconnects). DO wait for `migrate` to finish so the API never serves an
    # un-migrated schema — this is what makes `up` auto-apply pending migrations.
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      <<: *svc-health
    restart: unless-stopped

  # Public config read at RUNTIME (moyu-web is NOT baked at CI) — set below.
  web:
    image: ghcr.io/kunmoe/moyu-web:latest
    pull_policy: always
    environment:
      NUXT_API_BASE_SSR: http://moyu-api:5214/api/v1           # SSR → 本仓 api 服务名 moyu-api(唯一,避免与 kungal api 冲突)
      NUXT_PUBLIC_API_BASE: https://www.moyu.moe/api/v1         # browser
      # OP = account.nextmoe.com (「NextMoe·未萌 账号」) since infra's 2026-09 rebrand.
      # oauth.kungal.com no longer answers: the edge 308 was removed on 2026-09-13
      # because it strips Authorization across the host change, so a stale value
      # here is an outage now, not a warning that still happens to work.
      NUXT_PUBLIC_OAUTH_SERVER_URL: https://account.nextmoe.com/api/v1
      NUXT_PUBLIC_OAUTH_WEB_URL: https://account.nextmoe.com
      NUXT_PUBLIC_OAUTH_CLIENT_ID: df3ff6008d740bfacbe46aa8cf483cf2
      NUXT_PUBLIC_OAUTH_REDIRECT_URI: https://www.moyu.moe/auth/callback
    expose: ["3000"]
    depends_on:
      moyu-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      <<: *svc-health
    restart: unless-stopped
    # Memory cap + auto-restart = OOM-recycle backstop for the upstream Nuxt
    # 4.2.2 SSR memory leak (nuxt#34071). moyu-web was observed at ~2.0–2.14 GiB
    # with CPU spikes; 2.5g leaves headroom over the current working set and
    # OOM-recycles (restart: unless-stopped) once the leak grows past it, so it
    # can't bloat unbounded / starve the box. Raise/remove once upstream is fixed.
    deploy:
      resources:
        limits:
          memory: 2560m

  # DB migrations — runs automatically on every `up`, BEFORE moyu-api (which
  # depends_on it completing). `-yes` = non-interactive (apply all pending, no
  # confirm prompt). pull_policy: always so each deploy gets the fresh image with
  # any newly-added migrations baked in. Idempotent + near-instant when nothing
  # is pending; a failed migration blocks the API from starting (intended — never
  # serve an un-migrated schema). NOT in the `jobs` profile so plain `up` runs it.
  # Manual run still works: `docker compose -f docker-compose.prod.yml run --rm migrate -dir=down`.
  migrate:
    image: ghcr.io/kunmoe/moyu-migrate:latest
    pull_policy: always
    environment: { <<: *moyu-api-env }
    # -path /migrations is EXPLICIT (not relying on CWD): the image's WORKDIR is
    # /home/nonroot, so the binary's default relative "migrations" would find
    # nothing and silently apply zero migrations. -yes = non-interactive.
    command: ["-path", "/migrations", "-yes"]
    restart: "no"

  # ─────────────────────── one-off jobs (profile: jobs) ──────────────────────
  # Run AFTER infra postgres up + kungalgame_patch exists. ORDER: docs/migration.

  # All cmd/* binaries (migrate-oauth-prep / remap-patch-ids / backfill-release-date):
  #   docker compose -f docker-compose.prod.yml --profile jobs run --rm tools remap-patch-ids
  tools:
    image: ghcr.io/kunmoe/moyu-tools:latest
    pull_policy: always
    environment: { <<: *moyu-api-env }
    profiles: ["jobs"]
    restart: "no"

networks:
  default:
    name: dokploy-network
    external: true
