# Build moyu images and push to GHCR, then trigger a Dokploy redeploy.
# See docs/deploy/13-registry-ci.md.
#
# moyu-web's browser-facing public config is read at RUNTIME from docker/web.env's
# NUXT_PUBLIC_* names, so one image works in any environment — set the real https
# domains in Dokploy / web.env, not here. The api image bakes apps/web/posts
# (about-page .mdx) via go.Dockerfile; nothing to configure for that here.
name: build-and-push

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: run the reusable go-test suite first. build / push / deploy only
  # proceed if it passes, so a red suite never ships (test -> build -> deploy).
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: moyu-api
            file: docker/go.Dockerfile
            args: CMD=server
          - name: moyu-migrate
            file: docker/go.Dockerfile
            args: CMD=migrate
          - name: moyu-tools           # every cmd/* binary, for one-off data-cutover jobs
            file: docker/tools.Dockerfile
            args: ""
          - name: moyu-web
            file: docker/nuxt.Dockerfile
            args: APP=web
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: true
          tags: |
            ghcr.io/kunmoe/${{ matrix.name }}:latest
            ghcr.io/kunmoe/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Dokploy's compose webhook is a GitHub webhook receiver, not a button.
      # It reads the branch out of the BODY and only looks there when the
      # request carries x-github-event, so the bare `curl -X POST` this step
      # used to send answered `{"message":"Branch Not Match"}` — with status
      # 301, which `curl -f` does not treat as an error, and a green step.
      # Every master build since 2026-06-02 pushed images nothing deployed.
      #
      # So: forward the push event's own ref and commits, and fail the step on
      # anything but 200 (301 = branch or watchPaths mismatch, 400 = autoDeploy
      # off, 404 = wrong token). workflow_dispatch has no commits; watchPaths
      # is empty on this compose, which matches everything.
      - name: Trigger Dokploy redeploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_MOYU }}
          REF: ${{ github.ref }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DOKPLOY_WEBHOOK_MOYU not set — images pushed to GHCR, skipping redeploy trigger."
            exit 0
          fi
          body=$(jq -nc --arg ref "$REF" --argjson commits "${COMMITS:-null}" \
            '{ref: $ref, commits: ($commits // [])}')
          out=$(mktemp)
          code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            --data "$body")
          echo "dokploy responded $code: $(cat "$out")"
          test "$code" = "200"
