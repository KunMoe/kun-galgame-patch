components:
  schemas:
    ArtifactResponse:
      additionalProperties: false
      properties:
        checksum:
          type: string
        created_at:
          type: string
        description:
          type: string
        file_size:
          format: int64
          type: integer
        mime_type:
          type: string
        name:
          type: string
        public:
          type: boolean
        site_key:
          type: string
        status:
          format: int64
          type: integer
        uuid:
          type: string
      required:
        - uuid
        - site_key
        - name
        - description
        - file_size
        - mime_type
        - checksum
        - status
        - public
        - created_at
      type: object
    CompleteUploadRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CompleteUploadRequest.json
          format: uri
          readOnly: true
          type: string
        manifest:
          $ref: "#/components/schemas/ManifestInput"
        parts:
          description: "Deprecated and ignored: the service assembles the part list from storage."
          items:
            $ref: "#/components/schemas/CompletedPart"
          type:
            - array
            - "null"
      type: object
    CompletedPart:
      additionalProperties: false
      properties:
        etag:
          type: string
        part_number:
          format: int32
          type: integer
      required:
        - part_number
        - etag
      type: object
    CompositeDeleteData:
      additionalProperties: false
      properties:
        deleted:
          type: boolean
        id:
          type: string
      required:
        - id
        - deleted
      type: object
    CompositeListData:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/CompositeResponse"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    CompositeResponse:
      additionalProperties: false
      properties:
        artifacts:
          description: UUIDs of the artifacts this composite pins, in source order
          items:
            type: string
          type:
            - array
            - "null"
        blake3:
          description: Absent when the plan was created without one
          type: string
        content_type:
          type: string
        created_at:
          type: string
        filename:
          type: string
        id:
          description: "Content-addressed: the same plan from the same site always yields the same id"
          type: string
        inline_bytes:
          format: int64
          type: integer
        segment_count:
          format: int64
          type: integer
        site_key:
          type: string
        size:
          format: int64
          type: integer
        url:
          description: Public download URL; absent while the site has no artifact_cdn_base
          type: string
      required:
        - id
        - site_key
        - filename
        - content_type
        - size
        - artifacts
        - segment_count
        - inline_bytes
        - created_at
      type: object
    CompositeSegment:
      additionalProperties: false
      properties:
        length:
          description: Bytes taken from that offset
          format: int64
          minimum: 1
          type: integer
        offset:
          description: Byte offset inside that source
          format: int64
          minimum: 0
          type: integer
        source:
          description: Index into sources
          format: int64
          minimum: 0
          type: integer
      required:
        - source
        - offset
        - length
      type: object
    CompositeSourceInput:
      additionalProperties: false
      properties:
        artifact_uuid:
          description: A ready, public, undeleted artifact of the caller's own site. Exactly one of artifact_uuid and data.
          format: uuid
          type: string
        data:
          contentEncoding: base64
          description: Inline bytes (standard base64), stored with the composite instead of as an artifact — the zip glue. All inline sources together are capped at 8 MiB. Exactly one of artifact_uuid and data.
          type: string
        size:
          description: "Optional check: the source's exact byte length. A mismatch refuses the composite."
          format: int64
          minimum: 1
          type: integer
      type: object
    CreateCompositeRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CreateCompositeRequest.json
          format: uri
          readOnly: true
          type: string
        blake3:
          description: Optional BLAKE3 of the assembled file, lowercase hex, served as the ETag; not recomputed by the service. Without it the ETag is the composite id, which already hashes the plan.
          pattern: ^[0-9a-f]{64}$
          type: string
        content_type:
          description: Media type of the assembled file, e.g. application/zip
          maxLength: 100
          minLength: 1
          type: string
        filename:
          description: Download filename, sent as an attachment Content-Disposition
          maxLength: 255
          minLength: 1
          type: string
        segments:
          description: The assembled file, in order
          items:
            $ref: "#/components/schemas/CompositeSegment"
          maxItems: 100000
          minItems: 1
          type:
            - array
            - "null"
        size:
          description: Exact byte length of the assembled file; must equal the sum of the segment lengths
          format: int64
          minimum: 1
          type: integer
        sources:
          items:
            $ref: "#/components/schemas/CompositeSourceInput"
          maxItems: 64
          minItems: 1
          type:
            - array
            - "null"
      required:
        - filename
        - content_type
        - size
        - sources
        - segments
      type: object
    DeleteData:
      additionalProperties: false
      properties:
        deleted:
          type: boolean
        uuid:
          type: string
      required:
        - uuid
        - deleted
      type: object
    DownloadResponse:
      additionalProperties: false
      properties:
        expires_at:
          type: string
        url:
          type: string
      required:
        - url
      type: object
    EnvelopeArtifactResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeArtifactResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/ArtifactResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeCompositeDeleteData:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeCompositeDeleteData.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/CompositeDeleteData"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeCompositeListData:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeCompositeListData.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/CompositeListData"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeCompositeResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeCompositeResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/CompositeResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeDeleteData:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeDeleteData.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/DeleteData"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeDownloadResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeDownloadResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/DownloadResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeInitUploadResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeInitUploadResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/InitUploadResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeListData:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeListData.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/ListData"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeResumeUploadResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeResumeUploadResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/ResumeUploadResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    HouseError:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/HouseError.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        message:
          type: string
      required:
        - code
        - message
      type: object
    InitUploadRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/InitUploadRequest.json
          format: uri
          readOnly: true
          type: string
        checksum:
          type: string
        description:
          type: string
        file_size:
          format: int64
          type: integer
        mime_type:
          type: string
        name:
          type: string
        part_size:
          description: Preferred multipart part size in bytes. Clamped to [5 MiB, 5 GiB] and raised so the file fits in 10000 parts; the response part_size is the one to slice by.
          format: int64
          type: integer
        public:
          type: boolean
        uploader_sub:
          type: string
      required:
        - name
        - file_size
      type: object
    InitUploadResponse:
      additionalProperties: false
      properties:
        expires_at:
          type: string
        multipart:
          type: boolean
        part_size:
          format: int64
          type: integer
        part_urls:
          items:
            $ref: "#/components/schemas/PartURL"
          type:
            - array
            - "null"
        upload_id:
          type: string
        upload_url:
          type: string
        uuid:
          type: string
      required:
        - uuid
        - multipart
        - expires_at
      type: object
    ListData:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ArtifactResponse"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    ManifestInput:
      additionalProperties: false
      properties:
        arguments:
          type: string
        executable:
          type: string
        requirements:
          additionalProperties: {}
          type: object
        save_path:
          type: string
        working_dir:
          type: string
      required:
        - executable
      type: object
    PartURL:
      additionalProperties: false
      properties:
        part_number:
          format: int32
          type: integer
        url:
          type: string
      required:
        - part_number
        - url
      type: object
    RenameArtifactRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/RenameArtifactRequest.json
          format: uri
          readOnly: true
          type: string
        name:
          description: New download filename. The extension must stay the same; the Content-Disposition of the stored object is rewritten to match.
          maxLength: 255
          minLength: 1
          type: string
      required:
        - name
      type: object
    ResumeUploadResponse:
      additionalProperties: false
      properties:
        expires_at:
          type: string
        multipart:
          type: boolean
        part_size:
          format: int64
          type: integer
        part_urls:
          items:
            $ref: "#/components/schemas/PartURL"
          type:
            - array
            - "null"
        upload_url:
          type: string
        uploaded_parts:
          items:
            $ref: "#/components/schemas/UploadedPart"
          type:
            - array
            - "null"
        uuid:
          type: string
      required:
        - uuid
        - multipart
        - expires_at
      type: object
    UploadedPart:
      additionalProperties: false
      properties:
        etag:
          type: string
        part_number:
          format: int32
          type: integer
        size:
          format: int64
          type: integer
      required:
        - part_number
        - etag
        - size
      type: object
info:
  title: KUN Artifact Service
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/artifacts:
    get:
      operationId: listArtifacts
      parameters:
        - description: 1-based page number
          explode: false
          in: query
          name: page
          schema:
            description: 1-based page number
            format: int64
            type: integer
        - description: Items per page (max 100)
          explode: false
          in: query
          name: page_size
          schema:
            description: Items per page (max 100)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeListData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List the site's artifacts (paginated)
      tags:
        - artifacts
    post:
      operationId: initUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitUploadRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeInitUploadResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Init an upload; returns presigned URL(s)
      tags:
        - artifacts
  /api/v1/artifacts/composites:
    get:
      operationId: listComposites
      parameters:
        - description: 1-based page number
          explode: false
          in: query
          name: page
          schema:
            description: 1-based page number
            format: int64
            type: integer
        - description: Items per page (max 100)
          explode: false
          in: query
          name: page_size
          schema:
            description: Items per page (max 100)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCompositeListData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List the site's composites (paginated, newest first)
      tags:
        - composites
    post:
      operationId: createComposite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompositeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCompositeResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: "Create a composite: one download spliced at serve time from byte ranges of the site's artifacts plus inline bytes (idempotent)"
      tags:
        - composites
  /api/v1/artifacts/composites/{id}:
    delete:
      operationId: deleteComposite
      parameters:
        - description: Composite id
          in: path
          name: id
          required: true
          schema:
            description: Composite id
            pattern: ^[0-9a-f]{32}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCompositeDeleteData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: "Delete a composite: its URL stops serving and its artifacts are unpinned"
      tags:
        - composites
    get:
      operationId: getComposite
      parameters:
        - description: Composite id
          in: path
          name: id
          required: true
          schema:
            description: Composite id
            pattern: ^[0-9a-f]{32}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCompositeResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Get a composite
      tags:
        - composites
  /api/v1/artifacts/{uuid}:
    delete:
      operationId: deleteArtifact
      parameters:
        - description: Artifact UUID
          in: path
          name: uuid
          required: true
          schema:
            description: Artifact UUID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDeleteData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Soft-delete an artifact (GC reclaims after TTL); other sites' composites over it are deleted
      tags:
        - artifacts
    get:
      operationId: getArtifact
      parameters:
        - description: Artifact UUID
          in: path
          name: uuid
          required: true
          schema:
            description: Artifact UUID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeArtifactResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Get artifact metadata
      tags:
        - artifacts
    patch:
      operationId: renameArtifact
      parameters:
        - description: Artifact UUID
          in: path
          name: uuid
          required: true
          schema:
            description: Artifact UUID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameArtifactRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeArtifactResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: "Rename an artifact: its download filename, extension unchanged (S2S only)"
      tags:
        - artifacts
  /api/v1/artifacts/{uuid}/complete:
    post:
      operationId: completeUpload
      parameters:
        - description: Artifact UUID
          in: path
          name: uuid
          required: true
          schema:
            description: Artifact UUID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeArtifactResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Finalize an upload (verify size, optional manifest)
      tags:
        - artifacts
  /api/v1/artifacts/{uuid}/download:
    get:
      operationId: downloadArtifact
      parameters:
        - description: Artifact UUID
          in: path
          name: uuid
          required: true
          schema:
            description: Artifact UUID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDownloadResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Issue a download URL (presigned, or Worker URL for public)
      tags:
        - artifacts
  /api/v1/artifacts/{uuid}/resume:
    get:
      operationId: resumeUpload
      parameters:
        - description: Artifact UUID
          in: path
          name: uuid
          required: true
          schema:
            description: Artifact UUID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResumeUploadResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Resume an interrupted upload (lists stored parts, re-presigns the missing ones)
      tags:
        - artifacts
